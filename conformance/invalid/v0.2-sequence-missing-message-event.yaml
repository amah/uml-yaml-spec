# Structurally invalid: message requires sendEventRef and receiveEventRef.
apiVersion: uml-yaml.org/v0.2
kind: uml:Model
metadata:
  id: urn:example:model:invalid-sequence
  name: InvalidSequence
packagedElements:
  - id: urn:example:interaction:invalid
    type: uml:Interaction
    name: Invalid
    messages:
      - id: urn:example:message:missing-event
        name: missingEvent
        messageSort: synchCall
        sendEventRef: urn:example:occurrence:send
